<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10131b">
  <title>Estradas da Noite — Mobile</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #10131b; }
    body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #game { display: block; width: 100%; height: 100%; border: 0; background: #10131b; }
    #fullscreen {
      position: fixed; z-index: 10; right: 12px; top: calc(env(safe-area-inset-top) + 12px);
      border: 1px solid #65718a; border-radius: 10px; padding: 10px 13px;
      color: #fff; background: rgba(16,19,27,.88); font: 600 14px system-ui, sans-serif;
    }
    @media (pointer: coarse) {
      #game { touch-action: manipulation; }
    }
  </style>
</head>
<body>
  <button id="fullscreen" type="button" aria-label="Ativar tela cheia">Tela cheia</button>
  <iframe id="game" src="index.html" title="Estradas da Noite" allow="fullscreen; gamepad; autoplay" allowfullscreen></iframe>
  <script>
    const game = document.getElementById('game');
    document.getElementById('fullscreen').addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) await (game.requestFullscreen ? game.requestFullscreen() : document.documentElement.requestFullscreen());
        else await document.exitFullscreen();
      } catch (error) {
        document.getElementById('fullscreen').textContent = 'Tela cheia indisponível';
      }
    });
    // Detecção aproximada para ajustes de interface; navegadores não garantem identificação perfeita.
    const isTouchDevice = navigator.maxTouchPoints > 0 || window.matchMedia('(pointer: coarse)').matches;
    document.documentElement.dataset.device = isTouchDevice ? 'touch' : 'desktop';
  </script>
</body>
</html>
